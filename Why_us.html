<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Numbers Don't Lie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;min-height:100vh;
  background:#0e0e0e;
  display:flex;align-items:center;justify-content:center;
}

/* ── SECTION WRAPPER ──────────────────────── */
.section{
  position:relative;
  width:100%;max-width:1440px;
  background:#111111;
  padding:64px 80px 72px;
  overflow:hidden;
  min-height:520px;
}

/* ── RIGHT-SIDE RADIAL GLOW ───────────────── */
.section::after{
  content:'';
  position:absolute;
  top:0;right:0;
  width:56%;height:100%;
  background:radial-gradient(
    ellipse 90% 110% at 88% 50%,
    rgba(68,68,68,0.60) 0%,
    rgba(40,40,40,0.28) 38%,
    transparent 72%
  );
  pointer-events:none;
  z-index:0;
}

/* ── TOP ROW ──────────────────────────────── */
.top-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:flex-end;
  gap:40px;
  position:relative;
  z-index:1;
  padding-bottom:44px;
}

/* ── HEADLINE COLUMN ──────────────────────── */
.headline-col{display:flex;flex-direction:column;}

.why-label{
  font-family:'Barlow',sans-serif;
  font-size:13px;font-weight:500;
  letter-spacing:0.06em;
  color:rgba(255,255,255,0.42);
  margin-bottom:10px;
}

.headline{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;
  font-size:clamp(72px,10.2vw,150px);
  line-height:0.875;
  color:#c9c9c9;
  letter-spacing:-0.01em;
  text-transform:uppercase;
}

/* ── SUPPORT COLUMN ───────────────────────── */
.support-col{
  display:flex;
  align-items:flex-end;
  padding-bottom:6px;
}

.support-text{
  font-family:'Barlow',sans-serif;
  font-size:16px;font-weight:400;
  line-height:1.65;
  color:rgba(255,255,255,0.38);
  max-width:360px;
}

/* ── DASHED SEPARATOR ─────────────────────── */
.dash-sep{
  width:100%;height:1px;
  background-image:repeating-linear-gradient(
    90deg,
    rgba(255,255,255,0.20) 0px,
    rgba(255,255,255,0.20) 4px,
    transparent 4px,
    transparent 11px
  );
  position:relative;z-index:1;
}

/* ── STATS ROW ────────────────────────────── */
.stats-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  position:relative;
  z-index:1;
  padding-top:42px;
}

/* ── STAT BLOCK ───────────────────────────── */
.stat-block{
  display:flex;
  flex-direction:column;
  gap:18px;
  padding-right:40px;
  position:relative;
}

/* vertical dashed divider — between blocks */
.stat-block + .stat-block{
  padding-left:40px;
}
.stat-block + .stat-block::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;width:1px;
  background-image:repeating-linear-gradient(
    180deg,
    rgba(255,255,255,0.20) 0px,
    rgba(255,255,255,0.20) 4px,
    transparent 4px,
    transparent 11px
  );
}

/* ── STAT NUMBER ──────────────────────────── */
.stat-number{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:clamp(52px,5.8vw,82px);
  line-height:1;
  color:#c8c8c8;
  letter-spacing:-0.01em;
  display:flex;
  align-items:baseline;
}

.stat-sfx{
  color:#e84820;
  font-size:0.82em;
  font-weight:700;
  /* tiny nudge to align with baseline */
  margin-left:1px;
}

/* ── STAT LABEL ───────────────────────────── */
.stat-label{
  font-family:'Barlow',sans-serif;
  font-size:13.5px;font-weight:400;
  line-height:1.62;
  color:rgba(255,255,255,0.38);
  letter-spacing:0.01em;
}
</style>
</head>
<body>
<div class="section">

  <!-- TOP ROW -->
  <div class="top-row">
    <div class="headline-col">
      <span class="why-label">(WHY US)</span>
      <h1 class="headline">NUMBERS<br/>DON'T LIE</h1>
    </div>
    <div class="support-col">
      <p class="support-text">
        With a decade of expertise, We crafts bold brands and high-impact digital experience that get results.
      </p>
    </div>
  </div>

  <!-- DASHED SEPARATOR -->
  <div class="dash-sep"></div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-block">
      <div class="stat-number">300<span class="stat-sfx">+</span></div>
      <p class="stat-label">Successful projects<br/>completed</p>
    </div>
    <div class="stat-block">
      <div class="stat-number">7<span class="stat-sfx">+</span></div>
      <p class="stat-label">Years of experience<br/>in creative industry</p>
    </div>
    <div class="stat-block">
      <div class="stat-number">99<span class="stat-sfx">%</span></div>
      <p class="stat-label">Customer<br/>satisfaction rate</p>
    </div>
    <div class="stat-block">
      <div class="stat-number">25<span class="stat-sfx">M</span></div>
      <p class="stat-label">In Client revenue<br/>growth</p>
    </div>
  </div>

</div>
</body>
</html>
